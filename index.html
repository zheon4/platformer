<!DOCTYPE html>
<html>
<body>

  <canvas id="myCanvas" width="300" height="150" style="border: 4px dashed black;"></canvas>

  <script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#123abc";
    ctx.fillRect(20, 20, 150, 100);
  </script>

</body>
</html>
